# --- DYNAMIC MONITOR CONFIG ---
source = ~/.config/hypr/monitor.conf
# --- AUTOSTART ---
exec-once = bash -c 'while true; do steam -gamepadui -noverifyfiles -fulldesktopres; \
                        killall -s 9 steamwebhelper steam steam-runtime-supervisor 2>/dev/null; \
                        sleep 3; done'

# --- HARDWARE CURSOR FIX ---
cursor {
    no_hardware_cursors = true
}

input {
    # List the layouts you want to support (comma-separated)
    kb_layout = us,us,de,de
    kb_variant = ,euro,,mac
    
    # Use Alt+Shift to instantly cycle through them
    kb_options = grp:alt_shift_toggle
}

general {
    allow_tearing = true
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# --- KIOSK MODE (Performance & Focus) ---
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = false
    
    # --- CRITICAL STEAM FOCUS FIXES ---
    # 1. Allow games to instantly steal focus from Steam when launched
    focus_on_activate = true
    
    # 2. Hyprland 0.53+ syntax (replaces new_window_takes_over_fullscreen)
    # This determines how new windows behave when a fullscreen app is active
    on_focus_under_fullscreen = 2
}
windowrulev2 = float, title:^(Steam Keyboard)$
windowrulev2 = center, title:^(Steam Keyboard)$
windowrulev2 = pin, title:^(Steam Keyboard)$

# 2. Catch all other Steam Web overlays (achievements, friend popups)
windowrulev2 = float, class:^(steamwebhelper)$, title:^(Steam)$

# 3. Immediate rule (Tearing)
windowrulev2 = immediate, class:^(.*)$
